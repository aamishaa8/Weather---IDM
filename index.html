<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather</title>
</head>
<body>
    <h1>Check the Weather!</h1>

<div class="card">
    <h2>🗽 New York, USA</h2>
    <button id="button1">Show Weather</button>
    <p id="time1"></p>
    <p id="temp1"></p>
</div>

<div class="card">
    <h2>🌞 New Delhi, India</h2>
    <button id="button2">Show Weather</button>
    <p id="time2"></p>
    <p id="temp2"></p>
</div>

  <script src="weather.js"></script>
</body>
<style>
    
 /* I wanted to style my HTML so it is centre-aligned and 
I used cards to give each a basic layout.
I chose blue because weather apps often use blue, yellow
and grey to represent different weather conditions.*/

    body {
        font-family: Arial, sans-serif;
        background: #eaf2ff;
        text-align: center;
        padding: 30px;
    }

    h1 {
        color: #325186;
    }

    .card {
        background: white;
        padding: 25px;
        margin: 20px auto;
        border-radius: 15px;
        max-width: 350px;
    }

</style>
</html>
